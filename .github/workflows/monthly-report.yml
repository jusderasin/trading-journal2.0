name: 📈 Rapport Mensuel TradingZone

on:
  schedule:
    # Le 1er de chaque mois à 8h00 heure de Paris (UTC+2 = 6h UTC)
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  send-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        run: npm install @supabase/supabase-js node-fetch

      - name: 📈 Générer et envoyer les rapports mensuels
        env:
          SUPABASE_URL: https://nwmvqyykvqqhbaqiqzpr.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          PERIOD: month
        run: node scripts/generate-report.js
